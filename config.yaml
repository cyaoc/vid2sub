# Vid2Sub configuration. Precedence: command-line arguments > this file > built-in defaults.

model:
  # Tiny, Base, Small, Medium, LargeV3, LargeV3Turbo
  type: "LargeV3Turbo"
  # Where models are downloaded and cached. A relative path is resolved from the executable's directory.
  storage_dir: "./models"

inference:
  # Language code such as "zh", "en", "ja", or "auto" to detect it
  language: "auto"
  # Processing threads (0 = one per CPU core)
  threads: 0
  # Beam search width: higher is more accurate but slower
  beam_size: 5

output:
  # text, srt, vtt
  format: "vtt"
  # Print the run settings and every recognized segment
  verbose: true

# Proofreads the recognized text with the Claude Code CLI installed on this machine: fixes misrecognized
# terms, removes text Whisper invented over silence, and merges or splits cues that are too short or too long.
# Needs `claude` on PATH and signed in, otherwise the run stops with an error; the text is sent to Anthropic.
# What it fixes is written in correction-rules.md beside the executable. How long a cue should be and where it
# may break depends on the language and is in correction-rules.<language>.md, which is added for subtitles in
# that language. Both are plain text sent to the model as they are: edit them freely, in any language, and keep
# notes for people out of them. Delete a file to get its built-in version back.
correction:
  # true proofreads every run; --glossary <file> turns it on for one run
  enabled: false
  # Model ID passed to `claude --model`
  model: "claude-opus-5-5"
  # How hard the model thinks: low, medium, high, xhigh, max. Higher is slower and uses more of the
  # Claude usage limit; low leaves overlong cues and misses terms.
  effort: "medium"
  # Term list with the correct spellings: an .xlsx workbook, or a text file with one term per line.
  # A relative path is resolved from the executable's directory (from the current directory for --glossary).
  # glossary: "./glossary.xlsx"
  # Header of the workbook column that holds the terms in the language of the subtitles; the other columns
  # (translations) are left out. Also -G / --glossary-column. Not needed when the workbook has one column.
  # glossary_column: "ja"
